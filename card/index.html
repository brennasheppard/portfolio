<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brenna Sheppard · Clear Touch Specialist</title>
  <meta name="description" content="Contact Brenna Sheppard, Clear Touch Specialist for Comal ISD." />
  <meta name="theme-color" content="#b76e79" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>BS</text></svg>" />
  <style>
    :root {
      --bg: #fff5f7;
      --bg-secondary: #ffeef1;
      --card: #fff9fa;
      --ink: #2d2428;
      --muted: #5a4a4e;
      --accent: #b76e79;
      --accent-light: #d4a5a5;
      --accent-hover: #9a5a64;
      --line: #e8d0d4;
      --shadow: rgba(183, 110, 121, 0.15);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
    }
    .bar { height: 10px; background: linear-gradient(90deg, var(--accent), var(--accent-light)); }
    .wrap {
      max-width: 420px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }
    header { text-align: center; }
    .avatar {
      width: 96px; height: 96px;
      border-radius: 50%;
      margin: 0 auto 14px;
      background: var(--accent) url("photo.jpg") center/cover no-repeat;
      border: 3px solid #fff;
      box-shadow: 0 4px 16px var(--shadow);
    }
    h1 { margin: 0; font-size: 1.55rem; color: var(--ink); letter-spacing: -0.02em; }
    .role { margin: 4px 0 0; color: var(--accent); font-weight: 650; }
    .org { margin: 2px 0 0; color: var(--muted); font-size: .92rem; }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 18px 18px 8px;
      margin-top: 22px;
      border: 1px solid var(--line);
      box-shadow: 0 8px 28px var(--shadow);
    }
    .actions a {
      display: block;
      text-align: center;
      text-decoration: none;
      border-radius: 12px;
      padding: 13px 14px;
      margin-bottom: 10px;
      font-weight: 650;
    }
    .primary { background: var(--accent); color: #fff; }
    .primary:hover { background: var(--accent-hover); }
    .ghost {
      background: var(--bg-secondary);
      color: var(--accent);
    }
    .ghost:hover { background: var(--accent-light); color: #fff; }
    .links { margin: 8px 0 16px; }
    .links a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 4px;
      border-bottom: 1px solid var(--line);
      color: var(--ink);
      text-decoration: none;
      font-size: .98rem;
    }
    .links a span { color: var(--muted); font-size: .86rem; }
    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 6px 0 16px;
    }
    .split a {
      text-align: center;
      text-decoration: none;
      background: var(--bg-secondary);
      color: var(--accent);
      font-weight: 650;
      padding: 12px 8px;
      border-radius: 12px;
      font-size: .9rem;
    }
    footer {
      text-align: center;
      margin-top: 22px;
      color: var(--muted);
      font-size: .8rem;
    }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="bar"></div>
  <main class="wrap">
    <header>
      <div class="avatar" role="img" aria-label="Brenna Sheppard"></div>
      <h1>Brenna Sheppard</h1>
      <p class="role">Clear Touch Specialist</p>
      <p class="org">Comal ISD Digital Learning</p>
    </header>

    <section class="card">
      <div class="actions">
        <a class="primary" href="brenna.vcf">Add to Contacts</a>
        <a class="ghost" href="tel:+18302728353">Call 830-272-8353</a>
        <a class="ghost" href="mailto:brenna.sheppard@comalisd.org">Email Brenna</a>
        <a class="ghost" href="https://tinyurl.com/ClearTouchResource">Resources</a>
        <a class="ghost" href="https://brennasheppard.com">Portfolio</a>
        <a class="ghost" href="https://calendly.com/bsheppard-getcleartouch">Book with Me</a>
      </div>

      <div class="split">
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSch1bsWkbU_dD-qrBAdsSPlCjpZh9-zoiu3c0S_oudX6o5vRg/viewform?usp=send_form">Feedback</a>
        <a href="https://linkedin.com/in/brenna-sheppard">LinkedIn</a>
      </div>
    </section>

    <footer>
      Scan, tap NFC, or open
      <a href="https://brennasheppard.com/card">brennasheppard.com/card</a>
    </footer>
  </main>
</body>
</html>
